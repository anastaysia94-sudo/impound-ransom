name: Extract impound-ransom.zip

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'impound-ransom.zip'
      - '.github/workflows/Impound-ransom.yaml'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Extract zip
        run: |
          if [ ! -f impound-ransom.zip ]; then
            echo "impound-ransom.zip not found in the repo root" >&2
            exit 1
          fi
          rm -rf extracted || true
          unzip -o impound-ransom.zip -d extracted

      - name: Move files to repository root (strip top-level folder)
        run: |
          if [ -d extracted/impound-ransom ]; then
            rsync -a extracted/impound-ransom/ ./
          else
            rsync -a extracted/ ./
          fi
          rm -rf extracted

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Archive is already fully extracted."
            exit 0
          fi
          git commit -m "Extract impound-ransom.zip to repo root (automated)"
          git push origin HEAD:main
