name: Extract impound-ransom.zip

on:
  workflow_dispatch: {}

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Extract zip
        run: |
          if [ ! -f impound-ransom.zip ]; then
            echo "impound-ransom.zip not found in the repo root" >&2
            exit 1
          fi
          rm -rf extracted || true
          unzip -o impound-ransom.zip -d extracted

      - name: Move files to repository root (strip top-level folder)
        run: |
          # If the zip contains impound-ransom/ as the top-level directory, copy its contents to repo root
          if [ -d extracted/impound-ransom ]; then
            rsync -a extracted/impound-ransom/ .
          else
            # Otherwise, copy everything from extracted/ into the repo root
            rsync -a extracted/ ./
          fi

      - name: Commit & push extracted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract impound-ransom.zip to repo root (automated)" || echo "No changes to commit"
          git push origin HEAD
